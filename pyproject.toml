[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tscan-docs"
version = "0.3.0"
description = "Multilingual document understanding pipeline for Markdown and schema-guided JSON extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TScan contributors" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "starlette>=0.46,<0.47",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13",
  "pypdfium2>=4.30,<6",
  "jsonschema[format]>=4.23,<5",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
local = [
  "torch>=2.5",
  "transformers>=4.57,<6",
  "accelerate>=1.2,<3",
  "safetensors>=0.5,<1",
]
train = [
  "datasets>=3.2,<5",
  "trl>=0.23,<2",
  "peft>=0.17,<1",
  "bitsandbytes>=0.45,<1",
]

[project.scripts]
tscan = "tscan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tscan"]

[tool.hatch.build.targets.sdist]
include = ["src/tscan", "schemas", "training", "tests", "data", "README.md", "CHANGELOG.md", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
